name: Update install manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'firmware/install-manifest.json'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate firmware/install-manifest.json
        run: |
          python3 - <<'EOF'
          import json, os

          EXCLUDE_DIRS = {'.vscode', '.git'}
          EXCLUDE_FILES = {'settings.json', 'install-manifest.json', 'manifest.json'}

          files = []
          for root, dirs, filenames in os.walk('firmware'):
              dirs[:] = sorted(
                  d for d in dirs
                  if d not in EXCLUDE_DIRS and not d.startswith('.')
              )
              for name in sorted(filenames):
                  if name in EXCLUDE_FILES or name.startswith('.'):
                      continue
                  path = os.path.relpath(os.path.join(root, name), 'firmware')
                  files.append(path.replace('\\', '/'))

          with open('firmware/install-manifest.json', 'w') as f:
              json.dump({"files": files}, f, indent=2)
              f.write('\n')

          print(f"Wrote {len(files)} entries to firmware/install-manifest.json")
          for p in files:
              print(f"  {p}")
          EOF

      - name: Commit and push manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update install-manifest.json"
          file_pattern: firmware/install-manifest.json
